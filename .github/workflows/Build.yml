name: Test flushtools.h

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: '**'

jobs:
  # flushtools.h is a single header with no build system (per the README:
  # "Drop flushtools.h into your project and you're done"), so this compiles
  # the test file directly with each compiler instead of going through CMake
  # -- there's no CMakeLists.txt in this repo, and adding one just to satisfy
  # a build system the library explicitly doesn't need would be its own
  # source of drift from what users actually do.
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Show every failure, not just the first -- gcc, clang and cl exercise
      # genuinely different code paths in flushtools.h (see the #if/#elif on
      # __GNUC__ / __clang__ / _MSC_VER), so one failing doesn't imply the
      # others would too.
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
            compiler: gcc

          - name: Linux / Clang
            os: ubuntu-latest
            compiler: clang

          - name: Windows / MSVC
            os: windows-latest
            compiler: msvc

    steps:
      - uses: actions/checkout@v4

      # Clang's LAMBDA/AS_FN path uses the Blocks extension (-fblocks), which
      # needs libBlocksRuntime on Linux -- clang alone isn't enough.
      - name: Install Blocks runtime (Clang only)
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libblocksruntime-dev

      # cl.exe isn't on PATH by default on the windows-latest runner; this
      # loads the right vcvarsall environment for it.
      - name: Set up MSVC environment (Windows only)
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (GCC)
        if: matrix.compiler == 'gcc'
        run: gcc -std=c11 -Wall -Wextra -Werror -o test_flushtools test_flushtools.c -lm

      - name: Build (Clang)
        if: matrix.compiler == 'clang'
        run: clang -std=c11 -Wall -Wextra -Werror -fblocks -o test_flushtools test_flushtools.c -lm -lBlocksRuntime

      - name: Build (MSVC)
        if: matrix.compiler == 'msvc'
        shell: cmd
        run: cl /std:c11 /W4 /Fe:test_flushtools.exe test_flushtools.c

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ./test_flushtools

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\test_flushtools.exe

  # LAMBDA/AS_FN on GCC use nested-function trampolines, which need an
  # executable stack -- this is a known, unresolved limitation (see
  # BUGS.md item 4) that reliably crashes under ASan. This job exists so
  # that crash stays visible in CI instead of only showing up if someone
  # happens to build with a sanitizer locally. continue-on-error keeps it
  # from blocking merges until the library itself addresses the bug.
  asan:
    name: Linux / GCC / ASan (known failure, see BUGS.md #4)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan + UBSan
        run: gcc -std=c11 -Wall -Wextra -fsanitize=address,undefined -g -o test_flushtools_asan test_flushtools.c -lm
      - name: Run tests under ASan
        run: ./test_flushtools_asan